# =============================================================================
# Data Generator — Grocery / Supermarket
# Configuration file — mounted read-only into the generator container.
# Changes here take effect on the next tick (no restart needed).
# =============================================================================

generator:
  tick_interval_seconds: 30        # wall-clock seconds between generation ticks.
                                   # Realtime writes one tick per this many seconds
                                   # (2880/day at 30 s) and the POS volume law sizes
                                   # the tick from it — not from the simulated clock
                                   # below (t_94bbf1ce).
  simulation_minutes_per_tick: 15  # simulated time a tick would represent under an
                                   # accelerated clock. Realtime does NOT implement
                                   # that clock and this value must not size the
                                   # volume: doing so ran every realtime day at 30x
                                   # the configured pos_transactions_per_day.
  backfill_lookback_days: 30       # history a fresh DB is backfilled over; also
                                   # the horizon promo validity windows start at

locations:
  store_count: 3                   # number of store locations
  warehouse_count: 1               # number of warehouse / DC locations
  store_employees_per_location:
    min: 20
    max: 40
  warehouse_employees_per_location:
    min: 10
    max: 20

volumes:
  pos_transactions_per_day:
    min: 800
    max: 3000

  # 24 hourly weights — grocery peaks at late morning/early afternoon and after work
  hourly_weights:
    - 0.0017   # 0  dead hours
    - 0.0008   # 1  dead hours
    - 0.0008   # 2  dead hours
    - 0.0008   # 3  dead hours
    - 0.0017   # 4  pre-dawn
    - 0.0050   # 5  early morning (store opens, stocking staff arrive)
    - 0.0129   # 6  morning ramp
    - 0.0258   # 7  rush building
    - 0.0446   # 8  rush peak
    - 0.0646   # 9  late rush
    - 0.0817   # 10 morning peak
    - 0.0896   # 11 midday PEAK
    - 0.0896   # 12 lunch peak PEAK
    - 0.0704   # 13 post-lunch lull starts
    - 0.0558   # 14 afternoon lull
    - 0.0483   # 15 lull continues
    - 0.0629   # 16 ramp back up
    - 0.0817   # 17 after-work rush
    - 0.0938   # 18 dinner prep PEAK (highest)
    - 0.0750   # 19 evening decline (requested: traffic lower 7-11pm)
    - 0.0446   # 20 continued decline
    - 0.0283   # 21 winding down
    - 0.0129   # 22 late night
    - 0.0067   # 23 very low (requested: low 11pm-6am)

  day_of_week_multipliers:
    monday:    0.88
    tuesday:   0.85
    wednesday: 0.90
    thursday:  0.95
    friday:    1.10
    saturday:  1.25   # biggest grocery day
    sunday:    1.15

loyalty:
  signup_rate: 0.06        # slightly higher than gas station
  loyalty_usage_rate: 0.40 # grocery loyalty cards used more often
  initial_member_count: 300 # initial members seeded at startup

products:
  initial_count: 500       # more SKUs than gas station
  departments:
    - name: Produce
      code: PRD
      categories:
        - name: Vegetables
          subcategories: [Leafy Greens, Root Vegetables, Squash, Peppers, Onions, Tomatoes]
        - name: Fruits
          subcategories: [Apples, Citrus, Berries, Tropical, Melons, Stone Fruit]
    - name: Dairy & Eggs
      code: DAI
      categories:
        - name: Dairy
          subcategories: [Milk, Cheese, Yogurt, Butter, Cream, Sour Cream]
        - name: Eggs
          subcategories: [Large, Extra Large, Organic, Free Range]
    - name: Meat & Seafood
      code: MEA
      categories:
        - name: Beef
          subcategories: [Ground Beef, Steaks, Roasts, Short Ribs]
        - name: Pork
          subcategories: [Chops, Ribs, Sausage, Bacon, Ham]
        - name: Poultry
          subcategories: [Chicken Breast, Chicken Thighs, Whole Chicken, Turkey, Ground Turkey]
        - name: Seafood
          subcategories: [Salmon, Tilapia, Shrimp, Tuna, Cod]
    - name: Bakery
      code: BAK
      categories:
        - name: Bread
          subcategories: [White, Wheat, Sourdough, Rye, Rolls, Baguettes]
        - name: Pastries
          subcategories: [Muffins, Croissants, Donuts, Danish, Cakes, Cookies]
    - name: Deli
      code: DEL
      categories:
        - name: Prepared Foods
          subcategories: [Rotisserie, Salads, Hot Foods, Sandwiches, Soups]
        - name: Deli Meats
          subcategories: [Turkey, Ham, Salami, Roast Beef, Bologna]
        - name: Cheese Counter
          subcategories: [Cheddar, Swiss, Provolone, Brie, Gouda, Pepper Jack]
    - name: Frozen Foods
      code: FRZ
      categories:
        - name: Frozen Meals
          subcategories: [Pizza, Burritos, TV Dinners, Pot Pies, Pasta]
        - name: Frozen Vegetables
          subcategories: [Peas, Corn, Green Beans, Broccoli, Mixed Vegetables]
        - name: Ice Cream
          subcategories: [Vanilla, Chocolate, Novelty Bars, Sherbet, Gelato]
    - name: Beverages
      code: BEV
      categories:
        - name: Cold Drinks
          subcategories: [Soda, Juice, Water, Sports Drinks, Energy Drinks, Tea, Coffee]
        - name: Alcohol
          subcategories: [Beer, Wine, Hard Cider, Hard Seltzer, Spirits]
    - name: Snacks & Candy
      code: SNK
      categories:
        - name: Snacks
          subcategories: [Chips, Pretzels, Popcorn, Crackers, Nuts, Granola Bars, Rice Cakes]
        - name: Candy
          subcategories: [Chocolate, Gummies, Hard Candy, Mints, Licorice]
    - name: Canned & Dry Goods
      code: CDG
      categories:
        - name: Canned Goods
          subcategories: [Soup, Vegetables, Beans, Tomatoes, Tuna, Fruit]
        - name: Dry Goods
          subcategories: [Pasta, Rice, Cereal, Oatmeal, Flour, Sugar, Dried Beans]
    - name: Household
      code: HOU
      categories:
        - name: Cleaning
          subcategories: [Laundry, Dish Soap, All-Purpose Cleaner, Paper Towels, Toilet Paper]
        - name: Kitchen
          subcategories: [Foil, Plastic Wrap, Bags, Storage Containers]
    - name: Personal Care
      code: PCR
      categories:
        - name: Health
          subcategories: [Pain Relievers, Vitamins, Cold & Flu, First Aid, Digestion]
        - name: Beauty
          subcategories: [Shampoo, Conditioner, Body Wash, Deodorant, Lotion, Razors]

pricing:
  product_price_change_frequency_days: 14   # grocery prices change more often than gas station
  tax_rate: 0.07                            # most groceries taxed lower / exempt
  price_history_backfill_days: 90           # seed this many days of price_history at startup (price-elasticity)

  # --- Price -> demand elasticity (t_08deeddf) ---------------------------
  # A SKU's pull on a basket follows its own price relative to its reference
  # price: weight = (paid / reference) ** elasticity. These four keys are the
  # whole loop; with them at their defaults the 90-day price_history backfill
  # above finally explains the demand it was seeded for, and
  # mart_product_price_elasticity measures ~-0.5 instead of noise.
  default_price_elasticity: -0.5   # -0.5 = a 10% price rise costs ~5% of units
  elasticity_jitter: 0.15          # per-SKU spread around the default (+/-15%);
                                  # 0 makes every SKU identical
  price_min_ratio: 0.05            # floor on price/reference — a zero price makes
                                  # the ratio, and the curve, undefined
  price_market_factor_weight: 0.65 # how much of a seeded price change is a
                                  # store-wide inflation move (the rest is the
                                  # SKU's own decision, which is the part an
                                  # elasticity regression must be able to see).
                                  # 1.0 leaves nothing to identify; keep < 1.0.

inventory:
  initial_stock_per_product: 200
  restock_check_frequency_hours: 24
  # Safety margin on a reorder, as a fraction of the demand it covers while
  # the order is in transit. Read by ordering.check_and_create_orders since
  # t_959cd040: before, a sale was written at full requested quantity and
  # depletion floored at zero, so this number (and reorder_point/reorder_qty)
  # never influenced anything a shopper saw. Reorders are now sized from the
  # measured demand in inv.sku_demand_daily.
  restock_threshold_pct: 0.25
  # Days of measured demand a reorder covers. 1.0 = "cover tomorrow at today's
  # rate"; raise it to carry more stock per delivery.
  reorder_demand_window_days: 1
  # A computed reorder line is capped at this multiple of the seeded
  # reorder_qty, so one hot SKU (or a SKU with no ledger history yet) cannot
  # produce an unbounded order.
  reorder_qty_max_multiple: 4.0
  # Cap a sale at the stock the shelf actually has and record the difference as
  # a lost sale in inv.stockout_events. Leave this on: turning it off restores
  # the pre-t_959cd040 behaviour, where the feed books revenue for items the
  # store did not have.
  enforce_stock_availability: true

coupons:
  active_at_any_time: 8            # how many coupons are active at once
  valid_duration_days: 14          # coupon validity window
  coupon_use_rate: 0.20            # probability a loyalty member uses a coupon

combo_deals:
  active_at_any_time: 4            # how many combo deals active at once
  valid_duration_days: 7
  combo_use_rate: 0.15             # probability a transaction triggers a deal

transport:
  cost_per_mile: 1.85              # operational cost per mile (fuel + maintenance)

online:
  orders_per_day:                  # the channel's own baseline day, drawn once per
    min: 90                        # date (like pos_transactions_per_day). The
    max: 170                       # realised day is that draw shaped by the shared
                                   # hourly weights x day-of-week x rush hour
                                   # (~1.3x a Monday, ~1.9x a Saturday). Realtime
                                   # writes one tick per tick_interval_seconds
                                   # (2880/day at 30 s), each carrying its share of
                                   # the hour — sizing it any other way ran online
                                   # days ~120x this band (t_eb31c99f).
  pickup_share: 0.45               # share of online orders fulfilled as pickup
  service_fee_delivery: 5.99       # flat fee per delivery order
  cancel_rate: 0.06                # placed orders cancelled before ready
  noshow_rate: 0.05                # ready pickup orders that pass window uncalled

scenarios:
  rush_hour:
    volume_multiplier: 2.0
    hours: [9, 10, 11, 17, 18, 19]
  weekend:
    volume_multiplier: 1.3
    labor_multiplier: 1.1
  holiday_week:
    volume_multiplier: 1.6
    coupon_use_boost: 1.5
    labor_multiplier: 1.2
  double_coupons:
    coupon_multiplier: 2.0
    volume_multiplier: 1.1
  promotion:
    discount_pct: 0.15
    affected_departments: [Produce, Dairy & Eggs, Snacks & Candy]
    labor_multiplier: 1.15
  # New cross-domain scenarios (verisim#12)
  inflation_pressure:
    price_modifier: 1.15
    loyalty_modifier: 0.85
  severe_weather:
    volume_multiplier: 0.7
    attendance_modifier: 0.75
  supplier_disruption:
    shrinkage_modifier: 1.3
  regional_peak:
    stores: {}          # e.g. {"store-uuid-1": 1.4, "store-uuid-2": 1.2}
  deep_discount:
    price_modifier: 0.8
