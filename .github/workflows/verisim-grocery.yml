name: Verisim Grocery CI/CD

# Runner reality check before editing: `.github/CI-RUNNER.md`. The self-hosted
# runner is an act runner on a 40 G volume shared with a monitoring stack, the job
# runs INSIDE a container with the host's docker socket, and both facts have
# produced red CI that said nothing about the commit (t_cbb3b8dc, t_19eb986e).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: smiti/verisim-grocery
  # The second registry is an INTERNAL host and is deliberately NOT named here. This
  # repository is a public mirror, and Chris's standing rule (2026-10-04) is that the
  # internal Git host is never named in a public repo. The value comes from a repository
  # VARIABLE instead, which lives in repo settings rather than in this tree:
  #
  #   Settings -> Secrets and variables -> Actions -> Variables
  #     REGISTRY_NAME   e.g. <internal-host>
  #     REGISTRY_IMAGE  e.g. <internal-host>/<owner>/verisim-grocery
  #
  # Both are OPTIONAL. Empty means single-registry (Docker Hub only): the publish job
  # skips the second login, the second push and the cross-registry digest comparison,
  # still asserts that the Hub release actually landed, and says so in a notice — so
  # the default is the safe one and this workflow stays public-safe with no
  # configuration at all. Set them only on a private fork or a self-hosted runner where
  # the internal host may be named.
  #
  # Why the indirection rather than a placeholder string: data-lab pins this image BY
  # DIGEST, so a wrong or empty registry is a broken pull on every slot, not a cosmetic
  # default. See docs/image-pins.lock. The digest is identical either way; only the host
  # that serves it differs.
  REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
  REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}

jobs:
  test:
    name: Generator unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          pip install pytest pytest-cov httpx \
            "psycopg2-binary==2.9.10" "faker==24.0.0" "pyyaml==6.0.1"

      # Hard-fail: any generator test failure or coverage regression blocks the build.
      # Coverage floor lives in pyproject.toml [tool.coverage.report] fail_under.
      # Grocery suite carries the coverage gate; gas-station + support suites
      # run blocking without their own coverage floor.
      - name: Run grocery generator tests (blocking, with coverage floor)
        run: python -m pytest grocery/generator/tests/ -v --cov=grocery/generator --cov-report=term

      - name: Run gas-station + support generator tests (blocking)
        run: python -m pytest gas-station/generator/tests/ support/generator/tests/ -v

  integration:
    name: Build standalone image + smoke + API contract tests
    runs-on: ubuntu-latest
    # PUSHES ONLY — main and v* tags (t_19eb986e). This job builds a ~1 GB image
    # and drives a buildx builder whose state volume is multi-GB; the self-hosted
    # act runner has ONE 40 G volume, shared with a monitoring stack, and the
    # blocking `test` job above needs that space to stay green (a full runner made
    # it fail with OSError: [Errno 28] until infra pruned it, t_cbb3b8dc). A card
    # branch typically pushes several times, so running this on every pull
    # request was most of the runner's disk churn — and every one of those runs
    # built an image nobody consumed, because `publish` builds and pushes its own.
    #
    # Nothing is lost by moving it to main: Gitea PRs are squash-merged, so every
    # merge runs the image on main immediately, and `publish` needs BOTH this job
    # and `test` — a broken image still cannot be released. What is given up is
    # pre-merge feedback on image-level breakage (strip script, migrations,
    # supervisord); that now shows up as a red main minutes after the merge.
    #
    # A second runner / separate buildx cache was considered and rejected: there
    # is one volume, so a second cache directory on it is the same 40 G, and a
    # second runner is a new host to keep (infra's call, no disk saved).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest httpx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no Docker Hub login) — a push can validate the image without
      # repo secrets. Publishing is a separate job.
      #
      # `load: true` rather than `outputs: type=docker,dest=/tmp/image.tar` plus a
      # `docker load` step: the tar is a second full copy of a ~1 GB image, and it
      # lives inside this job container's writable layer on the runner's root.
      # buildx's docker exporter loads straight into the daemon (t_19eb986e).
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: grocery/standalone/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test
        run: |
          set -u
          IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          API_PORT_DEFAULT=8010
          API_PORT_IN_CONTAINER=8000

          # WHERE DOES A PUBLISHED PORT LAND? (t_19eb986e)
          #
          # On a hosted runner the job runs directly on the VM, so `-p 8010:8000`
          # publishes on the runner's own loopback and curl to 127.0.0.1:8010 works.
          #
          # On the self-hosted act runner (bench/108) the job runs INSIDE a
          # container with the host's docker socket mounted. The publish then
          # happens on the BENCH HOST, and `localhost` from the job container is
          # the job container itself — a sibling container is not reachable there.
          # Measured 2026-11-15 on a job-shaped container: `localhost:8010`
          # against a published sibling is "connection refused" every single time,
          # however healthy the image is. That is why this step used to spend its
          # whole 180 s budget and fail while supervisord reported all four
          # processes RUNNING: the image was fine, the address was wrong.
          #
          # So: work out whether this job is itself a container (its hostname, the
          # HOSTNAME env var, or the container id in /proc/self/mountinfo —
          # whichever docker can still inspect). If it is, give the smoke container
          # THIS container's network namespace instead of publishing anything: the
          # API is then on 127.0.0.1:8000, with no host publish, no host firewall
          # rule and no DNS to get wrong. If it is not, keep the publish path and
          # additionally try the bridge gateway and host.docker.internal, so a
          # future runner setup that defeats detection still has a route in.
          SELF_ID=""
          for cand in "$(cat /etc/hostname 2>/dev/null || true)" \
                      "${HOSTNAME:-}" \
                      "$(grep -o -m1 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo 2>/dev/null | cut -d/ -f2)"; do
            [ -n "${cand}" ] || continue
            if docker inspect "${cand}" >/dev/null 2>&1; then
              SELF_ID="${cand}"
              break
            fi
          done

          if [ -n "${SELF_ID}" ]; then
            echo "This job runs inside container ${SELF_ID}; the smoke container shares its network namespace."
            NET_ARGS="--network container:${SELF_ID}"
            CANDIDATE_URLS="http://127.0.0.1:${API_PORT_IN_CONTAINER}"
          else
            GW="$(ip route show default 2>/dev/null | awk '{print $3; exit}')"
            echo "This job runs directly on the runner host; publishing the API on ${API_PORT_DEFAULT}."
            NET_ARGS="-p ${API_PORT_DEFAULT}:${API_PORT_IN_CONTAINER}"
            CANDIDATE_URLS="http://127.0.0.1:${API_PORT_DEFAULT}"
            if [ -n "${GW}" ]; then
              CANDIDATE_URLS="${CANDIDATE_URLS} http://${GW}:${API_PORT_DEFAULT}"
            fi
            CANDIDATE_URLS="${CANDIDATE_URLS} http://host.docker.internal:${API_PORT_DEFAULT}"
          fi

          # --rm plus an ANONYMOUS data volume: docker deletes the volume with the
          # container, so a run cannot inherit a half-initialised PG data dir from
          # an earlier one and nothing is left on the runner's root to prune.
          docker run -d --name verisim-test --rm \
            ${NET_ARGS} \
            -v /var/lib/postgresql/data \
            "${IMAGE}"

          # Wait for /health up to 180s (fresh initdb + 30-day backfill startup)
          for i in $(seq 1 36); do
            sleep 5
            for url in ${CANDIDATE_URLS}; do
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "${url}/health" 2>/dev/null || true)
              echo "[${i}] GET ${url}/health -> ${HEALTH:-000}"
              if [ "${HEALTH}" = "200" ]; then
                # Every later step (the backfill wait below, the API contract
                # suite) reads this, so no step hard-codes an address again.
                echo "VERISIM_API_BASE_URL=${url}" >> "$GITHUB_ENV"
                echo "Smoke test: PASS (${url})"
                exit 0
              fi
            done
          done
          echo "Smoke test: FAIL — no candidate answered 200 in 180s."
          echo "Candidates tried: ${CANDIDATE_URLS}"
          docker ps -a --filter name=verisim-test
          docker logs verisim-test 2>&1 | tail -40
          exit 1

      # /health answers as soon as uvicorn is up — long before the container's
      # first-boot 30-day backfill has finished writing. The contract tests compare
      # row counts between two calls, so starting them mid-backfill makes a moving
      # row count look like pagination loss (that is exactly how main went red on
      # 2026-09-21: 3 failures, all "the count changed between two reads"). Wait for
      # the generator to leave backfill mode; the suite's quiesced_generator fixture
      # then pauses realtime generation for each walk.
      #
      # The address comes from the Smoke test step (VERISIM_API_BASE_URL), which is
      # the only place that knows where the container is reachable (t_19eb986e).
      - name: Wait for the initial 30-day backfill to finish
        run: |
          API="${VERISIM_API_BASE_URL:?the smoke test step must resolve this}"
          for i in $(seq 1 180); do
            MODE=$(curl -s "${API}/grocery/status" \
              | sed -n 's/.*"mode":"\([a-z]*\)".*/\1/p' | head -1)
            TOTAL=$(curl -s "${API}/grocery/pos/transactions?limit=1" \
              | sed -n 's/.*"total":\([0-9]*\).*/\1/p' | head -1)
            echo "[$i] ${API} mode=${MODE:-unknown} pos.transactions=${TOTAL:-unknown}"
            if [ "$MODE" = "realtime" ] || [ "$MODE" = "stopped" ]; then
              echo "Generator is out of backfill (mode=$MODE) — contract tests can run."
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Backfill never finished::The generator was still in backfill mode after 15 minutes, so the contract tests could not run against a settled dataset."
          exit 1

      # Hard-fail: image API regressions block the build. If the container's API
      # is up (smoke test passed) every contract test must pass; unreachable API
      # here means the smoke test raced, so fail rather than silently skip.
      # The suite reads VERISIM_API_BASE_URL (grocery/api/tests/conftest.py, which
      # defaults to http://localhost:8010 for local runs), set by the smoke step.
      - name: API contract tests (blocking)
        run: python -m pytest grocery/api/tests/ -v

      - name: Tear down test container
        if: always()
        run: docker rm -f verisim-test 2>/dev/null || true

  publish:
    name: Push to Docker Hub + our registry
    runs-on: ubuntu-latest
    needs: [test, integration]
    # Runs for a main/version-tag push (and publishes), and for a pull request, where it
    # deliberately skips publishing: a fork cannot see the repository secrets. Which of
    # the two branches this job takes is decided by the EVENT and never by whether the
    # credential happens to be empty — see "Require publish credentials" below.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # A publish that cannot run is a FAILURE, not a green notice. 2026-08-31 → 2026-09-21
      # is what the old behaviour bought: main went green on every push while publishing
      # nothing, `smiti/verisim-grocery:latest` sat frozen at 1.3.2, and the deploy picked
      # up the stale tag. On main and on v* tags an absent (or unusable) credential has to
      # be loud. Pull requests are the only skip, and that skip is the event's, not the
      # secret's — a release can therefore never be skipped silently again.
      #
      # THE PUBLISH GATE (t_4b05829c, Chris 2026-10-04) runs FIRST, before any credential
      # check: a held publish must not fail the run over a secret it will never use, or
      # every ordinary merge goes red. Everything below is conditional on its decision.
      #
      # Docker Hub is a release channel, not a commit feed. Measured before this gate:
      # 8 publishes in one day and 20 of 29 tags on smiti/verisim-grocery were bare
      # 40-character SHAs, because the trigger was `push: branches: [main]`.
      #
      # The gate publishes only when the push carries a version bump, so N commits in one
      # push still yield at most ONE image. It exits 1 only when it cannot decide (VERSION
      # absent) — publishing then would name an image by commit SHA, the exact failure
      # this prevents.
      - name: Publish gate — is this a release?
        id: gate
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-gate.sh \
            "${{ github.event.before }}" "${{ github.sha }}" \
            "${GITHUB_REF}" "${GITHUB_EVENT_NAME}"

      # Self-test in CI, including the case that must FAIL. A gate nobody has watched
      # fail is a gate that does not work.
      - name: Publish gate self-test
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/publish-gate-tests.sh

      # BOTH credential pairs are required *when a second registry is configured*, and
      # that is deliberate rather than strict: data-lab pins by digest, so a release
      # that reaches Docker Hub but not the internal registry is unusable to every slot.
      # That exact gap blocked data-dev's t_3f078e61 for hours on 2026-10-04 and needed
      # a hand-mirror to clear (t_94476148). Half a publish is the failure mode this step
      # exists to prevent, so the second pair is mandatory rather than best-effort:
      # warn-and-skip is how the gap opened in the first place, and it happened twice in
      # one day. With no REGISTRY_IMAGE configured there is nothing to half-publish, and
      # the gate below requires no registry credentials at all.
      - name: Require publish credentials
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          missing=""
          for var in DOCKER_USERNAME DOCKER_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing="${missing:+${missing}, }${var}"
            fi
          done
          # The second registry is OPTIONAL and is not named in this public repo: it is
          # configured with the REGISTRY_NAME/REGISTRY_IMAGE repository VARIABLES. With
          # no REGISTRY_IMAGE there is nothing to half-publish, so its credentials are
          # not required — and demanding them anyway is what made this workflow go red on
          # a public mirror where the internal host cannot be named at all.
          if [ -n "${REGISTRY_IMAGE:-}" ]; then
            for var in REGISTRY_USERNAME REGISTRY_PASSWORD; do
              if [ -z "${!var}" ]; then
                missing="${missing:+${missing}, }${var}"
              fi
            done
          else
            echo "::notice title=Single-registry publish::REGISTRY_IMAGE is not set (repository variable), so this publish targets Docker Hub only."
          fi
          if [ -n "${missing}" ]; then
            echo "::error title=Missing publish credential::Cannot publish ${IMAGE_NAME} for ${GITHUB_REF_NAME}: the repository secret(s) ${missing} are not set. Add them under smitimus/verisim -> Settings -> Secrets and variables -> Actions: DOCKER_USERNAME/DOCKER_PASSWORD are the Docker Hub account and a token with read/write on ${IMAGE_NAME}. If a second registry is configured (REGISTRY_IMAGE variable), REGISTRY_USERNAME/REGISTRY_PASSWORD are that registry's account and a token with write on the package. A versioned release is required to publish, so this run fails instead of skipping."
            exit 1
          fi
          if [ -n "${REGISTRY_IMAGE:-}" ]; then
            echo "Publish credentials are present (Docker Hub user=${DOCKER_USERNAME}, registry user=${REGISTRY_USERNAME})."
          else
            echo "Docker Hub credentials are present (DOCKER_USERNAME=${DOCKER_USERNAME})."
          fi

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # Gated on the same variable the tag step reads: with no REGISTRY_IMAGE there
      # is no second registry to log in to, and running this step with an empty
      # registry and empty credentials failed the whole publish on a mirror that
      # legitimately has none (t_a96f7f37).
      - name: Log in to our registry
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true' && vars.REGISTRY_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_NAME }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # The tag convention lives in ONE script, shared with the gas-station workflow,
      # because it used to be duplicated here and the two could drift.
      #
      # What it changed: a main push used to publish `:${GITHUB_SHA}` and nothing
      # else, so the registry filled with 40-character tags and the only version
      # tags were the v* tag pushes — 18 of the 28 tags on smiti/verisim-grocery
      # were bare SHAs on 2026-10-04, and the last versioned release was v1.3.3
      # on 2026-09-21 (t_4b05829c). A version you can read in the registry is now
      # the tracked VERSION file at the repo root, and the script refuses to
      # publish rather than falling back to the SHA: no VERSION, a malformed one,
      # a pyproject drift, or a v* tag that disagrees with VERSION all fail the
      # job by name.
      #
      # It is ALSO the only thing that names the second registry's refs, which is the
      # reconciliation this step exists to be (t_e1b1de67). PR #9 computed the Gitea
      # refs inline HERE while t_4b05829c moved the Hub refs into the script; the two
      # touched the same hunk, so whichever merged second silently dropped the other.
      # Now one script owns every tag name for both registries.
      #
      # `REQUIRE_SECOND_REGISTRY` FOLLOWS the variable rather than being hard-coded
      # to `true`. The script still refuses an unset REGISTRY_IMAGE when the
      # requirement is on, and reconciliation-tests.sh calls it directly to prove
      # that; but on a mirror with no repository variables — which is what this
      # public mirror is — the documented default (single registry, Docker Hub
      # only, second push skipped with a notice) used to be unreachable: a green
      # test+integration still died here with "REGISTRY_IMAGE is not set"
      # (t_a96f7f37). With the expression below, "configured" and "required" are
      # the same fact, so a configured second registry still cannot degrade to a
      # Hub-only push and an unconfigured one still publishes what it describes.
      #
      # The script emits the refs the verification step below re-reads: hub_ref,
      # registry_ref and version_ref, all as GITHUB_OUTPUT keys.
      - name: Compute tags
        id: meta
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          REGISTRY_IMAGE="${REGISTRY_IMAGE}" REQUIRE_SECOND_REGISTRY=${{ vars.REGISTRY_IMAGE != '' }} \
            bash .github/scripts/compute-push-tags.sh >> "$GITHUB_OUTPUT"
          if [ -n "${REGISTRY_IMAGE}" ]; then
            echo "::notice title=Published version::${IMAGE_NAME} will be tagged :${VERSION}, and ${REGISTRY_IMAGE} at ${registry_version_ref#*:} / ${dev_tag}"
            echo "hub:"
            echo "${hub_tags}"
            echo "registry:"
            echo "${registry_tags}"
          else
            echo "::notice title=Published version::${IMAGE_NAME} will be tagged :${VERSION} on Docker Hub only — no second registry is configured (REGISTRY_IMAGE repository variable is unset)."
            echo "hub:"
            echo "${hub_tags}"
          fi

      # ONE build, ONE push, TWO registries.
      #
      # Every tag leaves the one push above, which is what makes the two registries
      # hold the SAME index digest rather than merely equivalent builds. Measured on
      # 2026-10-04 (CT106, two throwaway registries, `--provenance=true`, which is
      # what produces the attestation): all the tags came back at one digest,
      # sha256:d676dec5…, and the provenance statement inside it listed ALL the
      # subject names. So the attestation does NOT fork per registry — it enumerates
      # every reference of the one build, which is exactly why one digest can serve
      # both.
      #
      # The digest pushed is the OCI INDEX, not a per-platform child: data-lab pins
      # b1589f84… (the index), and `platforms: linux/amd64` makes buildx produce that
      # index rather than a bare amd64 manifest. Pushing the child would produce a
      # different digest and silently break the pin.
      - name: Push to both registries
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: grocery/standalone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      # Assert the ARTIFACT, not the run status. A green job that pushed nothing is
      # precisely the failure this repo already had once, and it is why this step reads
      # both registries back and compares digests instead of trusting the push log.
      #
      # With no second registry configured, `registry_ref` is empty and the verifier
      # runs its Hub-only mode: same assertion ("a NON-EMPTY index really resolves for
      # the ref we pushed"), one registry instead of two. It does not become a no-op —
      # a tag that did not land still fails here (t_a96f7f37).
      - name: Verify the release is in both registries at one digest
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          bash .github/scripts/verify-release-in-both-registries.sh \
            "${{ steps.meta.outputs.hub_ref }}" \
            "${{ steps.meta.outputs.registry_ref }}" \
            "${GITHUB_SHA}"

      - name: Publishing held — not a release
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish != 'true'
        run: |
          echo "::notice title=Docker Hub publishing held::${GATE_REASON}. Gitea is the source of truth and this commit landed there automatically; the public GitHub mirror is published separately by the operator, and Docker Hub follows only a versioned release."
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}

      # On this runner a pull request never gets here: `integration` is push-only
      # (t_19eb986e) and a skipped `needs` job skips this one too — measured on PR
      # #17, where `publish` came back `skipped`, not `success`. Nothing is
      # published from a pull request either way; this stays as the fallback for
      # a runner that runs dependent jobs after a skip.
      - name: Publishing skipped — pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Publishing skipped (pull request)::Publishing runs on pushes to main and on v* tags. A pull request cannot see the repository secrets, so it builds and tests only - nothing is published and nothing needs to be."