name: Verisim Grocery CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: smiti/verisim-grocery

jobs:
  test:
    name: Generator unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          pip install pytest pytest-cov httpx \
            "psycopg2-binary==2.9.10" "faker==24.0.0" "pyyaml==6.0.1"

      # Hard-fail: any generator test failure or coverage regression blocks the build.
      # Coverage floor lives in pyproject.toml [tool.coverage.report] fail_under.
      # Grocery suite carries the coverage gate; gas-station + support suites
      # run blocking without their own coverage floor.
      - name: Run grocery generator tests (blocking, with coverage floor)
        run: python -m pytest grocery/generator/tests/ -v --cov=grocery/generator --cov-report=term

      - name: Run gas-station + support generator tests (blocking)
        run: python -m pytest gas-station/generator/tests/ support/generator/tests/ -v

  integration:
    name: Build standalone image + smoke + API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest httpx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no Docker Hub login) — PRs and forks can validate the image
      # without repo secrets. Publishing is a separate job.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: grocery/standalone/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Smoke test
        run: |
          docker run -d --name verisim-test --rm \
            -p 8010:8000 \
            -v /tmp/verisim_data:/var/lib/postgresql/data \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Wait for /health up to 180s (fresh initdb + 30-day backfill startup)
          for i in $(seq 1 36); do
            sleep 5
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8010/health 2>/dev/null || echo "000")
            if [ "$HEALTH" = "200" ]; then
              echo "Smoke test: PASS"
              break
            fi
            if [ "$i" = "36" ]; then
              echo "Smoke test: FAIL"
              docker logs verisim-test 2>&1 | tail -30
              exit 1
            fi
          done

      # Hard-fail: image API regressions block the build. If the container's API
      # is up (smoke test passed) every contract test must pass; unreachable API
      # here means the smoke test raced, so fail rather than silently skip.
      - name: API contract tests (blocking)
        run: python -m pytest grocery/api/tests/ -v

      - name: Tear down test container
        if: always()
        run: docker rm -f verisim-test 2>/dev/null || true

  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # The `secrets` context is not available in a job-level `if:`, so the credentials are
    # mapped to env here and every publishing step is gated on DOCKER_USERNAME being set.
    # Without the repo secrets the job stays green and skips publishing; with them it
    # publishes exactly as before. (Previously an unset secret failed the whole run at the
    # "Log in to Docker Hub" step, so a red X meant "no credentials", not "bad code".)
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Compute tags
        id: meta
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE_NAME}:latest,${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:latest,${IMAGE_NAME}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: grocery/standalone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Publish skipped — no Docker Hub credentials
        if: env.DOCKER_USERNAME == ''
        run: |
          echo "::notice title=Docker Hub publishing skipped::Add the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD to publish ${IMAGE_NAME}:latest and :${GITHUB_SHA}. Until then this job verifies nothing and publishes nothing."
