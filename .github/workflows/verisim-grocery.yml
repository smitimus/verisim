name: Verisim Grocery CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: smiti/verisim-grocery
  # The registry our own image pins name, not just the public one. data-lab pins
  # verisim-grocery BY DIGEST in this registry (verisim-grocery/compose.yaml +
  # docs/image-pins.lock), so a release that exists only on Docker Hub is invisible
  # to every slot. See "Two registries, one build" below.
  REGISTRY_NAME: gitea.afastbox.com
  REGISTRY_IMAGE: gitea.afastbox.com/admin/verisim-grocery

jobs:
  test:
    name: Generator unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          pip install pytest pytest-cov httpx \
            "psycopg2-binary==2.9.10" "faker==24.0.0" "pyyaml==6.0.1"

      # Hard-fail: any generator test failure or coverage regression blocks the build.
      # Coverage floor lives in pyproject.toml [tool.coverage.report] fail_under.
      # Grocery suite carries the coverage gate; gas-station + support suites
      # run blocking without their own coverage floor.
      - name: Run grocery generator tests (blocking, with coverage floor)
        run: python -m pytest grocery/generator/tests/ -v --cov=grocery/generator --cov-report=term

      - name: Run gas-station + support generator tests (blocking)
        run: python -m pytest gas-station/generator/tests/ support/generator/tests/ -v

  integration:
    name: Build standalone image + smoke + API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest httpx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no Docker Hub login) — PRs and forks can validate the image
      # without repo secrets. Publishing is a separate job.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: grocery/standalone/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Smoke test
        run: |
          docker run -d --name verisim-test --rm \
            -p 8010:8000 \
            -v /tmp/verisim_data:/var/lib/postgresql/data \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Wait for /health up to 180s (fresh initdb + 30-day backfill startup)
          for i in $(seq 1 36); do
            sleep 5
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8010/health 2>/dev/null || echo "000")
            if [ "$HEALTH" = "200" ]; then
              echo "Smoke test: PASS"
              break
            fi
            if [ "$i" = "36" ]; then
              echo "Smoke test: FAIL"
              docker logs verisim-test 2>&1 | tail -30
              exit 1
            fi
          done

      # /health answers as soon as uvicorn is up — long before the container's
      # first-boot 30-day backfill has finished writing. The contract tests compare
      # row counts between two calls, so starting them mid-backfill makes a moving
      # row count look like pagination loss (that is exactly how main went red on
      # 2026-09-21: 3 failures, all "the count changed between two reads"). Wait for
      # the generator to leave backfill mode; the suite's quiesced_generator fixture
      # then pauses realtime generation for each walk.
      - name: Wait for the initial 30-day backfill to finish
        run: |
          for i in $(seq 1 180); do
            MODE=$(curl -s http://localhost:8010/grocery/status \
              | sed -n 's/.*"mode":"\([a-z]*\)".*/\1/p' | head -1)
            TOTAL=$(curl -s "http://localhost:8010/grocery/pos/transactions?limit=1" \
              | sed -n 's/.*"total":\([0-9]*\).*/\1/p' | head -1)
            echo "[$i] mode=${MODE:-unknown} pos.transactions=${TOTAL:-unknown}"
            if [ "$MODE" = "realtime" ] || [ "$MODE" = "stopped" ]; then
              echo "Generator is out of backfill (mode=$MODE) — contract tests can run."
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Backfill never finished::The generator was still in backfill mode after 15 minutes, so the contract tests could not run against a settled dataset."
          exit 1

      # Hard-fail: image API regressions block the build. If the container's API
      # is up (smoke test passed) every contract test must pass; unreachable API
      # here means the smoke test raced, so fail rather than silently skip.
      - name: API contract tests (blocking)
        run: python -m pytest grocery/api/tests/ -v

      - name: Tear down test container
        if: always()
        run: docker rm -f verisim-test 2>/dev/null || true

  publish:
    name: Push to Docker Hub + our registry
    runs-on: ubuntu-latest
    needs: [test, integration]
    # Runs for a main/version-tag push (and publishes), and for a pull request, where it
    # deliberately skips publishing: a fork cannot see the repository secrets. Which of
    # the two branches this job takes is decided by the EVENT and never by whether the
    # credential happens to be empty — see "Require publish credentials" below.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # A publish that cannot run is a FAILURE, not a green notice. 2026-08-31 → 2026-09-21
      # is what the old behaviour bought: main went green on every push while publishing
      # nothing, `smiti/verisim-grocery:latest` sat frozen at 1.3.2, and the deploy picked
      # up the stale tag. On main and on v* tags an absent (or unusable) credential has to
      # be loud. Pull requests are the only skip, and that skip is the event's, not the
      # secret's — a release can therefore never be skipped silently again.
      #
      # BOTH credential pairs are required, and that is deliberate rather than strict:
      # data-lab pins by digest in OUR registry, so a release that reaches Docker Hub but
      # not gitea.afastbox.com is unusable to every slot — that exact gap blocked
      # data-dev's t_3f078e61 for hours on 2026-10-04 and needed a hand-mirror to clear
      # (t_94476148). Half a publish is the failure mode this step exists to prevent, so
      # the Gitea pair is mandatory rather than best-effort: warn-and-skip is how the gap
      # opened in the first place, and it happened twice in one day.
      - name: Require publish credentials
        if: github.event_name != 'pull_request'
        run: |
          missing=""
          for var in DOCKER_USERNAME DOCKER_PASSWORD REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing="${missing:+${missing}, }${var}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error title=Missing publish credential::Cannot publish ${IMAGE_NAME} for ${GITHUB_REF_NAME}: the repository secret(s) ${missing} are not set. Add them under smitimus/verisim -> Settings -> Secrets and variables -> Actions: DOCKER_USERNAME/DOCKER_PASSWORD are the Docker Hub account and a token with read/write on ${IMAGE_NAME}; REGISTRY_USERNAME/REGISTRY_PASSWORD are the ${REGISTRY_NAME} account and a token with write on package ${REGISTRY_IMAGE}. Both registries are required: data-lab pins this image by digest in ${REGISTRY_IMAGE}, so a release published to only one of them cannot be pulled by a slot. Publishing on main and on version tags is required, so this run fails instead of skipping."
            exit 1
          fi
          echo "Publish credentials are present (Docker Hub user=${DOCKER_USERNAME}, registry user=${REGISTRY_USERNAME})."

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log in to our registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_NAME }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Compute tags
        id: meta
        if: github.event_name != 'pull_request'
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            hub_ref="${IMAGE_NAME}:${GITHUB_SHA}"
          else
            hub_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          hub_tags="${hub_ref},${IMAGE_NAME}:latest"
          # Our registry carries a UTC dev-<date>-<HHMM> tag alongside the commit tag.
          #
          # The dev- tag is what data-lab's pin bump reads, and it is named for the
          # moment of the push rather than the commit: two releases inside one minute
          # would collide, which is acceptable because a collision overwrites a tag
          # nobody has pinned yet. What is NOT acceptable is re-pointing an EXISTING
          # tag, because rollback is deliberately a re-pin and not a rebuild — so a
          # tag already in the registry must keep naming the index it named before.
          # The verification step below is what turns that rule into something enforced
          # rather than remembered.
          DEV_TAG="dev-$(date -u +%Y-%m-%d-%H%M)"
          registry_ref="${REGISTRY_IMAGE}:${DEV_TAG}"
          registry_tags="${REGISTRY_IMAGE}:${GITHUB_SHA},${registry_ref}"
          {
            echo "tags=${hub_tags},${registry_tags}"
            echo "hub_ref=${hub_ref}"
            echo "registry_ref=${registry_ref}"
            echo "dev_tag=${DEV_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "  hub      : ${hub_tags}"
          echo "  registry : ${registry_tags}"

      # ONE build, ONE push, TWO registries.
      #
      # All four tags ride a single `docker buildx build --push`, which is what makes the
      # two registries hold the SAME index digest rather than merely equivalent builds.
      # Measured on 2026-10-04 (CT106, two throwaway registries, `--provenance=true`,
      # which is what produces the attestation): all four tags came back at one digest,
      # sha256:d676dec5…, and the provenance statement inside it listed ALL FOUR subject
      # names. So the attestation does NOT fork per registry — it enumerates every
      # reference of the one build, which is exactly why one digest can serve both.
      #
      # The digest pushed is the OCI INDEX, not a per-platform child: data-lab pins
      # b1589f84… (the index), and `platforms: linux/amd64` makes buildx produce that
      # index rather than a bare amd64 manifest. Pushing the child would produce a
      # different digest and silently break the pin.
      - name: Push to both registries
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: grocery/standalone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      # Assert the ARTIFACT, not the run status. A green job that pushed nothing is
      # precisely the failure this repo already had once, and it is why this step reads
      # both registries back and compares digests instead of trusting the push log.
      - name: Verify the release is in both registries at one digest
        if: github.event_name != 'pull_request'
        run: |
          bash .github/scripts/verify-release-in-both-registries.sh \
            "${{ steps.meta.outputs.hub_ref }}" \
            "${{ steps.meta.outputs.registry_ref }}" \
            "${GITHUB_SHA}"

      - name: Publishing skipped — pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Publishing skipped (pull request)::Publishing runs on pushes to main and on v* tags. A pull request cannot see the repository secrets, so it builds and tests only - nothing is published and nothing needs to be."
