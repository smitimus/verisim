name: Verisim Gas Station CI/CD

# Runner reality check before editing: `.github/CI-RUNNER.md` (the act runner's
# disk budget and the job-inside-a-container address problem, t_19eb986e).

# Why a second workflow instead of a job in verisim-grocery.yml (t_a6ecb731).
#
# gas-station had a unit-test step and nothing else: its standalone image was
# never built by CI, never smoke-tested, never contract-tested, and never
# published. `bash build-and-push.sh gas-station` therefore only worked by hand
# on a slot that had Docker, and Docker Hub's smiti/verisim-gas-station:latest
# was last pushed 2026-04-05 — before the self-contained revival (7a52b9c)
# reached main at all. A product whose only published artifact predates every
# change made to it is not "shipped"; it is stale by construction.
#
# The grocery workflow keeps its own shape — this is a separate file on purpose
# so the two do not have to be reconciled on every push, and so a gas-station
# failure cannot block (or be blocked by) the grocery publish.
#
# The publish guards are the grocery ones (t_c733ea2a / t_44f5663e), restated
# rather than shared: a missing credential must FAIL this job, and a pull
# request is the only event that skips publishing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: smiti/verisim-gas-station

jobs:
  test:
    name: Generator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # fastapi/uvicorn/pydantic are here for one reason: tools/check_strip_scripts
      # imports each stripped API to prove the output is loadable, and reports the
      # route set as unverified if those are missing (t_a6ecb731 — it failed the
      # first CI run of this branch for exactly that reason). Installing them keeps
      # the check at full strength instead of half-skipped.
      - name: Install test deps
        run: |
          pip install pytest pytest-cov httpx \
            "psycopg2-binary==2.9.10" "faker==24.0.0" "pyyaml==6.0.1" \
            "fastapi==0.115.6" "uvicorn[standard]==0.34.0" "pydantic==2.10.4"

      # Blocking, and the gas-station suite now carries the build/config
      # consistency checks (tools/check_*.py) as tests of its own — the strip
      # scripts and the config-fork gate that used to fail silently.
      - name: Run gas-station generator tests (blocking)
        run: python -m pytest gas-station/generator/tests/ -v

  integration:
    name: Build standalone image + smoke + API contract tests
    runs-on: ubuntu-latest
    # PUSHES ONLY — main and v* tags. Same decision as the grocery workflow
    # (t_19eb986e): this job builds a ~1 GB image plus a multi-GB buildx builder
    # state on the single 40 G act-runner volume that the blocking unit-test job
    # shares with a monitoring stack, and a card branch pushes several times per
    # PR. Every merge runs it again on main and `publish` needs both jobs, so a
    # broken gas-station image still cannot be released.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest httpx

      # DISK FIRST, BUILD SECOND (t_66c9f612). This job shares ONE 40 G volume with
      # the monitoring pane and with the other workflow's image job, and on
      # 2026-11-15 a grocery build immediately before it left the volume with no
      # room: the two attempts at THIS job's build both died at the buildx export
      # (`no space left on device`), so it never reached the smoke test or the
      # contract suite and `publish` was skipped silently. The reclaim step removes
      # only what the next build rebuilds — superseded `smiti/verisim-*` tags,
      # orphaned buildx builder state, and the ~900 MB postgres data volumes a
      # killed smoke test leaves behind — and fails up front, naming the runner, if
      # the volume still cannot hold a build. Rules and refusals:
      # `.github/scripts/reclaim-runner-disk.sh`, tests beside it.
      - name: Reclaim runner disk
        run: bash .github/scripts/reclaim-runner-disk.sh before

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no Docker Hub login) — a push can validate the image without
      # repo secrets. Publishing is a separate job.
      #
      # `load: true` instead of `outputs: type=docker,dest=/tmp/image.tar` + a
      # `docker load` step: the tar is a second full copy of a ~1 GB image inside
      # this job container's writable layer on the runner's root (t_19eb986e).
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gas-station/standalone/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # This is the step that did not exist before. build-and-push.sh has always
      # smoke-tested the image it built; CI had never done so for gas-station, so
      # a broken image could reach Docker Hub as long as its generator unit tests
      # passed. The unit tests do not start postgres, do not apply schema.sql
      # and do not run supervisord — which is where every one of this product's
      # historical failures lived (permission denied for schema X, t_ac80c514;
      # a stripped API that no longer imports).
      #
      # It has to be reachable from INSIDE the job, and on the self-hosted act
      # runner the job runs in a container with the host's docker socket: a `-p`
      # publish lands on the runner host, where the job cannot reach it (measured
      # "connection refused" every time, t_19eb986e). The block below shares this
      # container's network namespace with the smoke container when the job is
      # itself a container, and keeps the publish path on a hosted runner. See the
      # grocery workflow for the long version of this comment.
      - name: Smoke test
        run: |
          set -u
          IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          API_PORT_DEFAULT=8011
          API_PORT_IN_CONTAINER=8000

          SELF_ID=""
          for cand in "$(cat /etc/hostname 2>/dev/null || true)" \
                      "${HOSTNAME:-}" \
                      "$(grep -o -m1 'containers/[0-9a-f]\{64\}' /proc/self/mountinfo 2>/dev/null | cut -d/ -f2)"; do
            [ -n "${cand}" ] || continue
            if docker inspect "${cand}" >/dev/null 2>&1; then
              SELF_ID="${cand}"
              break
            fi
          done

          if [ -n "${SELF_ID}" ]; then
            echo "This job runs inside container ${SELF_ID}; the smoke container shares its network namespace."
            NET_ARGS="--network container:${SELF_ID}"
            CANDIDATE_URLS="http://127.0.0.1:${API_PORT_IN_CONTAINER}"
          else
            GW="$(ip route show default 2>/dev/null | awk '{print $3; exit}')"
            echo "This job runs directly on the runner host; publishing the API on ${API_PORT_DEFAULT}."
            NET_ARGS="-p ${API_PORT_DEFAULT}:${API_PORT_IN_CONTAINER}"
            CANDIDATE_URLS="http://127.0.0.1:${API_PORT_DEFAULT}"
            if [ -n "${GW}" ]; then
              CANDIDATE_URLS="${CANDIDATE_URLS} http://${GW}:${API_PORT_DEFAULT}"
            fi
            CANDIDATE_URLS="${CANDIDATE_URLS} http://host.docker.internal:${API_PORT_DEFAULT}"
          fi

          # --rm plus an anonymous data volume: no half-initialised PG data dir
          # survives between runs, and nothing is left on the runner's root.
          docker run -d --name verisim-gas-test --rm \
            ${NET_ARGS} \
            -v /var/lib/postgresql/data \
            "${IMAGE}"

          for i in $(seq 1 36); do
            sleep 5
            for url in ${CANDIDATE_URLS}; do
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "${url}/health" 2>/dev/null || true)
              echo "[${i}] GET ${url}/health -> ${HEALTH:-000}"
              if [ "${HEALTH}" = "200" ]; then
                echo "VERISIM_GAS_API_BASE_URL=${url}" >> "$GITHUB_ENV"
                echo "Smoke test: PASS (${url})"
                exit 0
              fi
            done
          done
          echo "Smoke test: FAIL — no candidate answered 200 in 180s."
          echo "Candidates tried: ${CANDIDATE_URLS}"
          docker ps -a --filter name=verisim-gas-test
          docker logs verisim-gas-test 2>&1 | tail -40
          exit 1

      # /health answers as soon as uvicorn is up, long before the first-boot
      # 30-day backfill has finished. The contract tests below compare row counts
      # between two calls, so running them mid-backfill makes a moving row count
      # look like pagination loss. The address is the smoke step's
      # VERISIM_GAS_API_BASE_URL, which is the only thing that knows where the
      # container is reachable (t_19eb986e).
      - name: Wait for the initial 30-day backfill to finish
        run: |
          API="${VERISIM_GAS_API_BASE_URL:?the smoke test step must resolve this}"
          for i in $(seq 1 180); do
            MODE=$(curl -s "${API}/gas-station/status" \
              | sed -n 's/.*"mode":"\([a-z]*\)".*/\1/p' | head -1)
            echo "[$i] ${API} mode=${MODE:-unknown}"
            if [ "$MODE" = "realtime" ] || [ "$MODE" = "stopped" ]; then
              echo "Generator is out of backfill (mode=$MODE) — contract tests can run."
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Backfill never finished::The generator was still in backfill mode after 15 minutes, so the contract tests could not run against a settled dataset."
          exit 1

      - name: API contract tests (blocking)
        run: python -m pytest gas-station/api/tests/ -v

      - name: Tear down test container
        if: always()
        # -v matters: the smoke container's postgres data dir is an ANONYMOUS volume,
        # and a plain `rm -f` leaves it behind — measured at 900 MB each on bench/108
        # (t_66c9f612). Without -v, every torn-down run costs the next build a gigabyte.
        run: docker rm -fv verisim-gas-test 2>/dev/null || true

      # Leave the runner as found: the image this job loaded and the builder buildx
      # created for it are both gone at the end, so a second image build in the same
      # push window starts from the same disk a first one did (t_66c9f612).
      - name: Reclaim runner disk after the job
        if: always()
        run: bash .github/scripts/reclaim-runner-disk.sh after "${{ env.IMAGE_NAME }}:${{ github.sha }}"

  publish:
    name: Push gas-station image to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, integration]
    # Same contract as the grocery publish: the skip is the EVENT's (a fork
    # cannot read the secrets), never the credential's. Between 2026-08-31 and
    # 2026-09-21 the grocery job reported success while publishing nothing, so
    # `latest` sat frozen and the deploy shipped the stale tag. Do not
    # reintroduce an `env.DOCKER_USERNAME != ''` gate here.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # THE PUBLISH GATE (t_4b05829c, Chris 2026-10-04) — the SAME gate the grocery
      # workflow uses, reading the SAME tracked VERSION file. Docker Hub is a release
      # channel, not a commit feed: gas-station shipped on every main push before this,
      # under a bare-SHA tag, exactly as grocery did. One VERSION, one gate, both images
      # tagged from the same release — so the two can never claim different versions.
      #
      # It runs FIRST: a held publish must not fail the run over a credential it will
      # never use, or every ordinary merge would go red.
      - name: Publish gate — is this a release?
        id: gate
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-gate.sh \
            "${{ github.event.before }}" "${{ github.sha }}" \
            "${GITHUB_REF}" "${GITHUB_EVENT_NAME}"

      # Self-test in CI, including the case that must FAIL.
      - name: Publish gate self-test
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/publish-gate-tests.sh

      - name: Require Docker Hub credentials
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          missing=""
          if [ -z "${DOCKER_USERNAME}" ]; then missing="DOCKER_USERNAME"; fi
          if [ -z "${DOCKER_PASSWORD}" ]; then
            missing="${missing:+${missing} and }DOCKER_PASSWORD"
          fi
          if [ -n "${missing}" ]; then
            echo "::error title=Missing Docker Hub credential::Cannot publish ${IMAGE_NAME} for ${GITHUB_REF_NAME}: the repository secret(s) ${missing} are not set. Add them under smitimus/verisim -> Settings -> Secrets and variables -> Actions (DOCKER_USERNAME = the Docker Hub account, DOCKER_PASSWORD = a Docker Hub access token with read/write on ${IMAGE_NAME}). Publishing on main and on version tags is required, so this run fails instead of skipping."
            exit 1
          fi
          echo "Docker Hub credentials are present (DOCKER_USERNAME=${DOCKER_USERNAME})."

      # Same disk rule as integration (t_66c9f612): a publish builds a ~1 GB image
      # too, and it runs in the same push window as the other workflow's jobs.
      - name: Reclaim runner disk
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: bash .github/scripts/reclaim-runner-disk.sh before

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # Same contract as grocery's, from the same script — one convention, one
      # implementation. See verisim-grocery.yml for what this replaced: a main
      # push used to publish `:${GITHUB_SHA}` and no version at all, which is how
      # 18 of the 28 tags on smiti/verisim-grocery ended up as bare SHAs
      # (t_4b05829c). Gas-station had the same defect and the same fix.
      - name: Compute tags
        id: meta
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        run: |
          bash .github/scripts/compute-push-tags.sh >> "$GITHUB_OUTPUT"
          {
            echo "::notice title=Published version::${IMAGE_NAME} will be tagged :${VERSION}"
            echo "tags:"
            echo "${tags}"
          }

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gas-station/standalone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Publishing held — not a release
        if: github.event_name != 'pull_request' && steps.gate.outputs.publish != 'true'
        run: |
          echo "::notice title=Docker Hub publishing held::${GATE_REASON}. Gitea is the source of truth and this commit landed there automatically; the public GitHub mirror is published separately by the operator, and Docker Hub follows only a versioned release."
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}

      # On this runner a pull request never gets here: `integration` is push-only
      # and a skipped `needs` job skips this one too (t_19eb986e). Kept as the
      # fallback for a runner that runs dependent jobs after a skip.
      - name: Publishing skipped — pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Docker Hub publishing skipped (pull request)::Publishing runs on pushes to main and on v* tags. A pull request cannot see the repository secrets, so it builds and tests only - nothing is published and nothing needs to be."
