# Verisim Gas Station — self-contained dev stack
# Services: postgres, api (gas-station-only routes), ui, generator
# 260320 - initial setup (generator only, required verisim-base)
# 260912 - redesigned: self-contained dev stack, no longer depends on
#          verisim-base (gas-station revival, t_a6ecb731). Ports offset from
#          grocery (5500/8011/8502) so both dev stacks can coexist.

services:

  verisim-gas-station-dev-postgres:
    container_name: verisim-gas-station-dev-postgres
    image: postgres:18
    environment:
      POSTGRES_USER: ${VERISIM_POSTGRES_USER:-verisim}
      POSTGRES_PASSWORD: ${VERISIM_POSTGRES_PASSWORD:-verisim}
      POSTGRES_DB: ${VERISIM_GAS_DB:-gas_station}
      TZ: ${TZ:-America/New_York}
    volumes:
      # Bind mount (not named volume) so data survives container lifecycle
      # changes and is directly accessible on the host (Chris's convention).
      - ${CONF:-/opt/conf}/verisim-gas-station-dev:/var/lib/postgresql
    ports:
      - "${VERISIM_GAS_POSTGRES_PORT:-5500}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${VERISIM_POSTGRES_USER:-verisim}", "-d", "${VERISIM_GAS_DB:-gas_station}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - verisim_gas_dev

  verisim-gas-station-dev-api:
    container_name: verisim-gas-station-dev-api
    build:
      context: ../
      dockerfile: gas-station/api/Dockerfile
    environment:
      POSTGRES_HOST: verisim-gas-station-dev-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${VERISIM_POSTGRES_USER:-verisim}
      POSTGRES_PASSWORD: ${VERISIM_POSTGRES_PASSWORD:-verisim}
      GAS_STATION_DB: ${VERISIM_GAS_DB:-gas_station}
      TZ: ${TZ:-America/New_York}
    ports:
      - "${VERISIM_GAS_API_PORT:-8011}:8000"
    depends_on:
      verisim-gas-station-dev-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - verisim_gas_dev

  verisim-gas-station-dev-ui:
    container_name: verisim-gas-station-dev-ui
    build:
      context: ../base/ui
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://verisim-gas-station-dev-api:8000
      TZ: ${TZ:-America/New_York}
    ports:
      - "${VERISIM_GAS_UI_PORT:-8502}:8501"
    depends_on:
      - verisim-gas-station-dev-api
    restart: unless-stopped
    networks:
      - verisim_gas_dev

  verisim-gas-station-dev-generator:
    container_name: verisim-gas-station-dev-generator
    build:
      context: ./generator
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: verisim-gas-station-dev-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${VERISIM_POSTGRES_USER:-verisim}
      POSTGRES_PASSWORD: ${VERISIM_POSTGRES_PASSWORD:-verisim}
      POSTGRES_DB: ${VERISIM_GAS_DB:-gas_station}
      CONF_PATH: /config/config.yaml
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      verisim-gas-station-dev-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - verisim_gas_dev

networks:
  verisim_gas_dev:
    name: verisim_gas_dev
    driver: bridge
