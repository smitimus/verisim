[project]
name = "verisim"
version = "0.1.0"
description = "Verisim mock data platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.4",
    "python-dateutil==2.9.0",
    "streamlit==1.41.1",
    "requests==2.32.3",
    "pandas==2.2.3",
    "plotly==5.24.1",
    "faker==24.0.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
generator = [
    "psycopg2-binary==2.9.10",
    "faker==24.0.0",
    "pyyaml==6.0.1",
]
api = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.4",
    "python-dateutil==2.9.0",
]
ui = [
    "streamlit==1.41.1",
    "requests==2.32.3",
    "pandas==2.2.3",
    "plotly==5.24.1",
]

[tool.pytest.ini_options]
testpaths = ["grocery/generator/tests", "grocery/api/tests"]

[tool.ruff]
line-length = 120
